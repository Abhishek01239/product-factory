name: factory-command

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  command:
    if: contains(github.event.issue.labels.*.name, 'factory-command')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute natural-language command
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE || 'approval_required' }}
        run: python factory/command.py
      - name: Upload factory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-command-${{ github.event.issue.number }}
          path: |
            runs/**/*.json
            runs/**/*.md
            memory/VERSION
          retention-days: 7
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "Factory command workflow completed. See the workflow run and uploaded factory report for the result."
