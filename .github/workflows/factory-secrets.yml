name: factory-secrets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Committed-secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan
        run: python scripts/scan_secrets.py

      - name: Report
        if: failure()
        run: python scripts/scan_secrets.py --json